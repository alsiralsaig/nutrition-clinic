name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # PostgreSQL حقيقي بنفس محرك Neon — كل دفع يُختبر على القاعدة التي ستعمل في الإنتاج
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_ADMIN: postgres://postgres:postgres@localhost:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: تغطية الترجمة الإنجليزية (كل نص عربي له ترجمة)
        run: node apps/web/i18n-extract.mjs --check

      - name: فحص إعداد Vercel (جسور /api + لا بقايا SQLite)
        run: npm run deploy:check

      - name: API smoke + features + portal (العادات، QR، الانتظار، المكالمات) — PGlite
        run: npm run test:api

      - name: API smoke + features + portal — PostgreSQL 17 حقيقي (مسار Neon)
        run: |
          psql "$PG_ADMIN/clinic_ci" -c "CREATE DATABASE clinic_smoke"
          psql "$PG_ADMIN/clinic_ci" -c "CREATE DATABASE clinic_feat"
          psql "$PG_ADMIN/clinic_ci" -c "CREATE DATABASE clinic_portal"
          DATABASE_URL="$PG_ADMIN/clinic_smoke" SEED_DEMO=1 node apps/api/test/smoke.test.js
          DATABASE_URL="$PG_ADMIN/clinic_feat" node apps/api/test/features.test.js
          DATABASE_URL="$PG_ADMIN/clinic_portal" node apps/api/test/portal.test.js

      - name: محاكاة Vercel — الوضع التجريبي + وضع Neon (البيانات تنجو من حاوية جديدة)
        run: |
          psql "$PG_ADMIN/clinic_ci" -c "CREATE DATABASE clinic_sim"
          SIM_DATABASE_URL="$PG_ADMIN/clinic_sim" npm run deploy:sim

      - name: API serves the built UI on one port (+ login عبر مسار متعدد المقاطع) + UI tests
        run: |
          psql "$PG_ADMIN/clinic_ci" -c "CREATE DATABASE clinic_serve"
          DATABASE_URL="$PG_ADMIN/clinic_serve" SEED_DEMO=1 node apps/api/src/server.js &
          for i in $(seq 1 40); do curl -fsS localhost:4000/api/health >/dev/null 2>&1 && break; sleep 0.5; done
          curl -fsS localhost:4000/api/health | grep -q '"engine":"postgres"'
          curl -fsS localhost:4000/ | grep -q 'dir="rtl"'
          curl -fsS localhost:4000/openapi.json | grep -q '"openapi"'
          curl -fsS localhost:4000/api/openapi.json | grep -q '"openapi"'
          curl -fsS localhost:4000/sw.js | grep -q 'notificationclick'
          curl -fsS localhost:4000/app.webmanifest | grep -q '"start_url": "/app"'
          curl -fsS localhost:4000/app | grep -q 'app.webmanifest'
          curl -fsSI localhost:4000/icons/icon-512.png | grep -qi 'image/png'
          TOKEN=$(curl -fsS -X POST localhost:4000/api/auth/login -H 'content-type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          test ${#TOKEN} -gt 100
          curl -fsS localhost:4000/api/dashboard/summary -H "authorization: Bearer $TOKEN" | grep -q '"patients"'
          npm run test:ui

      - name: واجهة المرحلة D — نافذتا الأخصائي والمريض (QR، العادات، الانتظار، إشارات المكالمة)
        run: |
          psql "$PG_ADMIN/clinic_ci" -c "CREATE DATABASE clinic_portal_ui"
          DATABASE_URL="$PG_ADMIN/clinic_portal_ui" SEED_DEMO=1 WHATSAPP_DRY_RUN=1 PUSH_DRY_RUN=1 PORT=4001 node apps/api/src/server.js &
          for i in $(seq 1 40); do curl -fsS localhost:4001/api/health >/dev/null 2>&1 && break; sleep 0.5; done
          UI_TEST_BASE=http://127.0.0.1:4001 npm run test:portal-ui
