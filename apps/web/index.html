<!doctype html>
<html lang="ar" dir="rtl">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f6360">
  <script>
      // قبل أي رسم: الوضع الداكن واللغة/الاتجاه من تفضيلات المستخدم — لا وميض ولا قفزة اتجاه
      (function () {
        try {
          var t = localStorage.getItem('clinic.theme') || 'system';
          var d = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) document.documentElement.classList.add('dark');
          var l = localStorage.getItem('clinic.lang');
          if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; document.title = 'Nutrition Clinic — Patient Management'; }
        } catch (e) {}
        // تطبيق المريض (/app أو #/portal) أو نظام الإدارة: ملف تثبيت مختلف لكل منهما
        var patient = /^\/app\/?$/.test(location.pathname) || location.hash.indexOf('#/portal') === 0;
        var m = document.createElement('link'); m.rel = 'manifest'; m.href = patient ? '/app.webmanifest' : '/staff.webmanifest';
        document.head.appendChild(m);
        var at = document.createElement('meta'); at.name = 'apple-mobile-web-app-title'; at.content = patient ? 'بوابتي الصحية' : 'إدارة العيادة';
        document.head.appendChild(at);
        if (patient) document.title = 'بوابتي الصحية';
      })();
    </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://gzkuoczegwcszdoqisjn.supabase.co/storage/v1/object/public/bucket/icon.png">
  <title>عيادة التغذية — نظام إدارة المرضى</title>
  <link rel="icon" type="image/png" href="https://gzkuoczegwcszdoqisjn.supabase.co/storage/v1/object/public/bucket/favicon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;family=Cairo:wght@400;600;700&amp;display=swap" rel="stylesheet">
 </head>
 <body class="bg-sand">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
 </body>
</html>
